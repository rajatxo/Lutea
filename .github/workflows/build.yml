name: Build Lutea APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    env:
      # NOTE: secret names are left as LOTUS_* because they already exist in the
      # repo's GitHub secrets. Renaming them would require manually recreating
      # the secrets. We'll keep the env var names but everything else is Lutea.
      LOTUS_KEYSTORE_BASE64: ${{ secrets.LOTUS_KEYSTORE_BASE64 }}
      LOTUS_STORE_PASSWORD: ${{ secrets.LOTUS_STORE_PASSWORD }}
      LOTUS_KEY_ALIAS: ${{ secrets.LOTUS_KEY_ALIAS }}
      LOTUS_KEY_PASSWORD: ${{ secrets.LOTUS_KEY_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Decode signing keystore
      run: |
        if [ -n "$LOTUS_KEYSTORE_BASE64" ]; then
          echo "$LOTUS_KEYSTORE_BASE64" | base64 -d > lutea-release.jks
          cat > keystore.properties << 'PROPS_EOF'
        storeFile=lutea-release.jks
        storePassword=PLACEHOLDER_STORE_PASS
        keyAlias=PLACEHOLDER_KEY_ALIAS
        keyPassword=PLACEHOLDER_KEY_PASS
        PROPS_EOF
          sed -i "s|PLACEHOLDER_STORE_PASS|$LOTUS_STORE_PASSWORD|g" keystore.properties
          sed -i "s|PLACEHOLDER_KEY_ALIAS|$LOTUS_KEY_ALIAS|g" keystore.properties
          sed -i "s|PLACEHOLDER_KEY_PASS|$LOTUS_KEY_PASSWORD|g" keystore.properties
          echo "Keystore decoded"
        else
          echo "No keystore — debug-signed only"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Pre-fetch Gradle distribution (mirror fallback)
      continue-on-error: true
      run: |
        # services.gradle.org intermittently returns 504 for the gradle-8.13
        # distribution. The wrapper's own retries all hit the same URL, so a
        # sustained outage fails the build. This step pre-fetches the zip from
        # any of several mirrors and places it where the wrapper expects it,
        # so the wrapper finds the file cached and skips its own download.
        DIST_DIR="$HOME/.gradle/wrapper/dists/gradle-8.13-bin"
        # The wrapper names the dist subdir by base36 of md5(distributionUrl).
        # For https://services.gradle.org/distributions/gradle-8.13-bin.zip
        # that hash is stable (observed in CI logs as 5xuhj0ry160q40clulazy9h7d).
        HASH_DIR="5xuhj0ry160q40clulazy9h7d"
        TARGET_DIR="$DIST_DIR/$HASH_DIR"
        if find "$TARGET_DIR" -name "gradle-8.13-bin.zip.ok" 2>/dev/null | grep -q .; then
          echo "Gradle distribution already cached at $TARGET_DIR"
          exit 0
        fi
        echo "Distribution not cached — trying mirrors..."
        TMP_ZIP="/tmp/gradle-8.13-bin.zip"
        for URL in \
          "https://services.gradle.org/distributions/gradle-8.13-bin.zip" \
          "https://downloads.gradle.org/distributions/gradle-8.13-bin.zip" \
          "https://mirrors.cloud.tencent.com/gradle/gradle-8.13-bin.zip" \
          "https://mirrors.huaweicloud.com/gradle/gradle-8.13-bin.zip"; do
          echo "Trying: $URL"
          if curl -fsSL --max-time 240 -o "$TMP_ZIP" "$URL" && [ -s "$TMP_ZIP" ]; then
            SIZE=$(stat -c%s "$TMP_ZIP")
            if [ "$SIZE" -gt 10000000 ]; then
              echo "Downloaded $SIZE bytes from $URL"
              mkdir -p "$TARGET_DIR"
              cp "$TMP_ZIP" "$TARGET_DIR/gradle-8.13-bin.zip"
              (cd "$TARGET_DIR" && unzip -q gradle-8.13-bin.zip && touch gradle-8.13-bin.zip.ok)
              echo "Placed at $TARGET_DIR"
              exit 0
            fi
            echo "File too small ($SIZE bytes), probably an error page — trying next mirror"
          fi
        done
        echo "All mirrors failed. The wrapper will retry on its own."

    - name: Auto-bump patch version
      run: |
        CURRENT_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/.*= *//; s/ *//' | tr -d '"')
        CURRENT_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*= *"//; s/".*//')
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_NAME"
        NEW_PATCH=$((PATCH + 1))
        NEW_NAME="${MAJOR}.${MINOR}.${NEW_PATCH}"
        NEW_CODE=$((MAJOR * 10000 + MINOR * 100 + NEW_PATCH))
        echo "Bumping: $CURRENT_NAME ($CURRENT_CODE) -> $NEW_NAME ($NEW_CODE)"
        sed -i "s/versionCode = .*/versionCode = $NEW_CODE/" app/build.gradle.kts
        sed -i "s/versionName = .*/versionName = \"$NEW_NAME\"/" app/build.gradle.kts
        git config user.name "Lutea CI"
        git config user.email "ci@lutea.local"
        git add app/build.gradle.kts
        git commit -m "chore: auto-bump to v$NEW_NAME" || true
        git push origin main || true

    - name: Build release APK
      run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2

    - name: Rename APK
      run: |
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*= *"//; s/".*//')
        APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
        if [ -n "$APK_PATH" ]; then
          mv "$APK_PATH" "app/build/outputs/apk/release/Lutea-v${VERSION_NAME}.apk"
        fi

    - name: Upload debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: lutea-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7

    - name: Upload release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: lutea-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
